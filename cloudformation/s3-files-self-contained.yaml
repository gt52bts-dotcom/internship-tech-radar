AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Self-contained Amazon S3 Files PoC stack. Creates a small VPC, S3 bucket,
  S3 Files file system, mount target, access point, client IAM role, and an
  optional Amazon Linux test instance that mounts the file system.

Parameters:
  NamePrefix:
    Type: String
    Default: s3files-poc
    Description: Lowercase prefix used in tags and the generated bucket name.
    AllowedPattern: "^[a-z0-9][a-z0-9-]{2,30}$"

  CreateTestInstance:
    Type: String
    Default: "false"
    Description: Set to true to create a small Amazon Linux EC2 instance that mounts S3 Files.
    AllowedValues:
      - "true"
      - "false"

  TestInstanceType:
    Type: String
    Default: t3.micro
    Description: EC2 instance type used only when CreateTestInstance is true.
    AllowedValues:
      - t3.micro
      - t3.small
      - t4g.micro
      - t4g.small

  LatestAmiIdX86:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Latest Amazon Linux 2023 x86_64 AMI.

  LatestAmiIdArm:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64
    Description: Latest Amazon Linux 2023 arm64 AMI.

  S3Prefix:
    Type: String
    Default: poc/
    Description: Optional S3 prefix exposed by this file system. Leave empty to expose the bucket root.
    AllowedPattern: "^(|.*/)$"

  AccessPointRootDirectory:
    Type: String
    Default: /
    Description: Root directory exposed through the S3 Files access point.
    AllowedPattern: "^(\\/|(\\/(?!\\.)+[^$#<>;;`|&?{}^*/\\n]+){1,4})$"

  PosixUid:
    Type: String
    Default: "1000"
    Description: POSIX UID enforced by the access point.
    AllowedPattern: "^[0-9]+$"

  PosixGid:
    Type: String
    Default: "1000"
    Description: POSIX GID enforced by the access point.
    AllowedPattern: "^[0-9]+$"

  RootDirectoryPermissions:
    Type: String
    Default: "0775"
    Description: POSIX permissions used if the access point root directory must be created.
    AllowedPattern: "^[0-7]{3,4}$"

Conditions:
  HasS3Prefix: !Not [!Equals [!Ref S3Prefix, ""]]
  ShouldCreateTestInstance: !Equals [!Ref CreateTestInstance, "true"]
  IsArmInstance: !Or
    - !Equals [!Ref TestInstanceType, t4g.micro]
    - !Equals [!Ref TestInstanceType, t4g.small]

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.77.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub "${NamePrefix}-vpc"

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "${NamePrefix}-igw"

  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref InternetGateway
      VpcId: !Ref Vpc

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: 10.77.1.0/24
      MapPublicIpOnLaunch: true
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${NamePrefix}-public-subnet"

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${NamePrefix}-public-rt"

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcGatewayAttachment
    Properties:
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet

  DataBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${NamePrefix}-${AWS::AccountId}-${AWS::Region}"
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Project
          Value: !Ref NamePrefix
        - Key: ManagedBy
          Value: CloudFormation

  S3FilesBucketAccessRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowS3FilesAssumeRole
            Effect: Allow
            Principal:
              Service: elasticfilesystem.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:s3files:${AWS::Region}:${AWS::AccountId}:file-system/*"
      Policies:
        - PolicyName: s3files-bucket-sync
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: S3BucketPermissions
                Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:ListBucketVersions
                Resource: !GetAtt DataBucket.Arn
                Condition:
                  StringEquals:
                    aws:ResourceAccount: !Ref AWS::AccountId
              - Sid: S3ObjectPermissions
                Effect: Allow
                Action:
                  - s3:AbortMultipartUpload
                  - s3:DeleteObject*
                  - s3:GetObject*
                  - s3:List*
                  - s3:PutObject*
                Resource: !Sub "${DataBucket.Arn}/*"
                Condition:
                  StringEquals:
                    aws:ResourceAccount: !Ref AWS::AccountId
              - Sid: EventBridgeManage
                Effect: Allow
                Action:
                  - events:DeleteRule
                  - events:DisableRule
                  - events:EnableRule
                  - events:PutRule
                  - events:PutTargets
                  - events:RemoveTargets
                Resource: !Sub "arn:${AWS::Partition}:events:*:*:rule/DO-NOT-DELETE-S3-Files*"
                Condition:
                  StringEquals:
                    events:ManagedBy: elasticfilesystem.amazonaws.com
              - Sid: EventBridgeRead
                Effect: Allow
                Action:
                  - events:DescribeRule
                  - events:ListRuleNamesByTarget
                  - events:ListRules
                  - events:ListTargetsByRule
                Resource: !Sub "arn:${AWS::Partition}:events:*:*:rule/*"

  S3FileSystem:
    Type: AWS::S3Files::FileSystem
    Properties:
      AcceptBucketWarning: true
      Bucket: !GetAtt DataBucket.Arn
      Prefix: !If [HasS3Prefix, !Ref S3Prefix, !Ref AWS::NoValue]
      RoleArn: !GetAtt S3FilesBucketAccessRole.Arn
      Tags:
        - Key: Name
          Value: !Sub "${NamePrefix}-fs"
        - Key: Project
          Value: !Ref NamePrefix

  ClientSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${NamePrefix} S3 Files client security group"
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub "${NamePrefix}-client-sg"

  MountTargetSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${NamePrefix} S3 Files mount target security group"
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 2049
          ToPort: 2049
          SourceSecurityGroupId: !Ref ClientSecurityGroup
          Description: Allow NFS traffic from the client security group.
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub "${NamePrefix}-mount-target-sg"

  S3FilesMountTarget:
    Type: AWS::S3Files::MountTarget
    Properties:
      FileSystemId: !GetAtt S3FileSystem.FileSystemId
      IpAddressType: IPV4_ONLY
      SecurityGroups:
        - !Ref MountTargetSecurityGroup
      SubnetId: !Ref PublicSubnet

  S3FilesAccessPoint:
    Type: AWS::S3Files::AccessPoint
    Properties:
      FileSystemId: !GetAtt S3FileSystem.FileSystemId
      PosixUser:
        Uid: !Ref PosixUid
        Gid: !Ref PosixGid
      RootDirectory:
        Path: !Ref AccessPointRootDirectory
        CreationPermissions:
          OwnerUid: !Ref PosixUid
          OwnerGid: !Ref PosixGid
          Permissions: !Ref RootDirectoryPermissions
      Tags:
        - Key: Name
          Value: !Sub "${NamePrefix}-access-point"
        - Key: Project
          Value: !Ref NamePrefix

  ClientInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore"
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonS3FilesClientFullAccess"
      Policies:
        - PolicyName: s3files-client-bucket-read
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: S3DirectReadOptimization
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource: !Sub "${DataBucket.Arn}/*"
              - Sid: S3BucketListAccess
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt DataBucket.Arn

  ClientInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref ClientInstanceRole

  S3FilesFileSystemPolicy:
    Type: AWS::S3Files::FileSystemPolicy
    Properties:
      FileSystemId: !GetAtt S3FileSystem.FileSystemId
      Policy:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowClientViaAccessPoint
            Effect: Allow
            Principal:
              AWS: !GetAtt ClientInstanceRole.Arn
            Action:
              - s3files:ClientMount
              - s3files:ClientWrite
            Condition:
              StringEquals:
                s3files:AccessPointArn: !GetAtt S3FilesAccessPoint.AccessPointArn

  TestInstance:
    Type: AWS::EC2::Instance
    Condition: ShouldCreateTestInstance
    DependsOn:
      - S3FilesMountTarget
      - S3FilesAccessPoint
      - S3FilesFileSystemPolicy
    Properties:
      IamInstanceProfile: !Ref ClientInstanceProfile
      ImageId: !If [IsArmInstance, !Ref LatestAmiIdArm, !Ref LatestAmiIdX86]
      InstanceType: !Ref TestInstanceType
      NetworkInterfaces:
        - AssociatePublicIpAddress: true
          DeviceIndex: 0
          GroupSet:
            - !Ref ClientSecurityGroup
          SubnetId: !Ref PublicSubnet
      Tags:
        - Key: Name
          Value: !Sub "${NamePrefix}-test-client"
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          dnf -y update
          dnf -y install amazon-efs-utils python3-pip
          python3 -m pip install --user botocore || true
          mkdir -p /mnt/s3files
          for i in $(seq 1 20); do
            if mount -t s3files ${S3FileSystem.FileSystemId}:/ /mnt/s3files; then
              echo "mounted at $(date -Iseconds)" > /mnt/s3files/cloudformation-mounted.txt
              sync
              break
            fi
            sleep 30
          done
          findmnt -T /mnt/s3files || true

Outputs:
  BucketName:
    Description: S3 bucket linked to the S3 Files file system.
    Value: !Ref DataBucket

  VpcId:
    Description: VPC created by this stack.
    Value: !Ref Vpc

  PublicSubnetId:
    Description: Public subnet created by this stack.
    Value: !Ref PublicSubnet

  ClientSecurityGroupId:
    Description: Security group to attach to any client compute resource that mounts this file system.
    Value: !Ref ClientSecurityGroup

  ClientInstanceRoleArn:
    Description: IAM role ARN that is allowed to mount through the access point.
    Value: !GetAtt ClientInstanceRole.Arn

  FileSystemId:
    Description: S3 Files file system ID.
    Value: !GetAtt S3FileSystem.FileSystemId

  FileSystemArn:
    Description: S3 Files file system ARN.
    Value: !GetAtt S3FileSystem.FileSystemArn

  MountTargetId:
    Description: S3 Files mount target ID.
    Value: !GetAtt S3FilesMountTarget.MountTargetId

  AccessPointId:
    Description: S3 Files access point ID.
    Value: !GetAtt S3FilesAccessPoint.AccessPointId

  AccessPointArn:
    Description: S3 Files access point ARN.
    Value: !GetAtt S3FilesAccessPoint.AccessPointArn

  TestInstanceId:
    Condition: ShouldCreateTestInstance
    Description: Optional EC2 test instance ID.
    Value: !Ref TestInstance

  MountCommand:
    Description: Run on a Linux client with amazon-efs-utils 3.0.0 or later.
    Value: !Sub "sudo mkdir -p /mnt/s3files && sudo mount -t s3files ${S3FileSystem.FileSystemId}:/ /mnt/s3files"

  AccessPointMountCommand:
    Description: Optional access-point mount command for stricter POSIX access-point testing.
    Value: !Sub
      - "sudo mkdir -p /mnt/s3files && sudo mount -t s3files -o accesspoint=${AccessPointId} ${FileSystemId} /mnt/s3files"
      - AccessPointId: !GetAtt S3FilesAccessPoint.AccessPointId
        FileSystemId: !GetAtt S3FileSystem.FileSystemId
