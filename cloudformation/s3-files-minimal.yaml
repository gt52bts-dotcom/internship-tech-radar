AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Minimal Amazon S3 Files stack: S3 bucket, S3 Files file system, mount target,
  access point, service role, and client permissions.

Parameters:
  NamePrefix:
    Type: String
    Default: s3files-poc
    Description: Lowercase prefix used for named resources.
    AllowedPattern: "^[a-z0-9][a-z0-9-]{2,30}$"

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC where the S3 Files mount target will be created.

  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Subnet for the S3 Files mount target. Use a subnet reachable by the client compute resource.

  ClientSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group attached to the EC2/ECS/EKS client that will mount the file system.

  ClientIamRoleName:
    Type: String
    Description: Name, not ARN, of the IAM role attached to the client compute resource.
    AllowedPattern: "^[a-zA-Z_0-9+=,.@\\-_/]+$"

  ClientIamRoleArn:
    Type: String
    Description: ARN of the IAM role attached to the client compute resource.
    AllowedPattern: "^arn:(aws[a-zA-Z-]*)?:iam::\\d{12}:role/?[a-zA-Z_0-9+=,.@\\-_/]+$"

  S3Prefix:
    Type: String
    Default: poc/
    Description: Optional S3 prefix exposed by this file system. Leave empty to expose the bucket root.
    AllowedPattern: "^(|.*/)$"

  AccessPointRootDirectory:
    Type: String
    Default: /
    Description: Root directory exposed through the S3 Files access point.
    AllowedPattern: "^(\\/|(\\/(?!\\.)+[^$#<>;;`|&?{}^*/\\n]+){1,4})$"

  PosixUid:
    Type: String
    Default: "1000"
    Description: POSIX UID enforced by the access point.
    AllowedPattern: "^[0-9]+$"

  PosixGid:
    Type: String
    Default: "1000"
    Description: POSIX GID enforced by the access point.
    AllowedPattern: "^[0-9]+$"

  RootDirectoryPermissions:
    Type: String
    Default: "0775"
    Description: POSIX permissions used if the access point root directory must be created.
    AllowedPattern: "^[0-7]{3,4}$"

Conditions:
  HasS3Prefix: !Not [!Equals [!Ref S3Prefix, ""]]

Resources:
  DataBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${NamePrefix}-${AWS::AccountId}-${AWS::Region}"
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Project
          Value: !Ref NamePrefix
        - Key: ManagedBy
          Value: CloudFormation

  S3FilesBucketAccessRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${NamePrefix}-s3files-service-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowS3FilesAssumeRole
            Effect: Allow
            Principal:
              Service: elasticfilesystem.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:s3files:${AWS::Region}:${AWS::AccountId}:file-system/*"
      Policies:
        - PolicyName: !Sub "${NamePrefix}-s3files-bucket-sync"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: S3BucketPermissions
                Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:ListBucketVersions
                Resource: !GetAtt DataBucket.Arn
                Condition:
                  StringEquals:
                    aws:ResourceAccount: !Ref AWS::AccountId
              - Sid: S3ObjectPermissions
                Effect: Allow
                Action:
                  - s3:AbortMultipartUpload
                  - s3:DeleteObject*
                  - s3:GetObject*
                  - s3:List*
                  - s3:PutObject*
                Resource: !Sub "${DataBucket.Arn}/*"
                Condition:
                  StringEquals:
                    aws:ResourceAccount: !Ref AWS::AccountId
              - Sid: EventBridgeManage
                Effect: Allow
                Action:
                  - events:DeleteRule
                  - events:DisableRule
                  - events:EnableRule
                  - events:PutRule
                  - events:PutTargets
                  - events:RemoveTargets
                Resource: !Sub "arn:${AWS::Partition}:events:*:*:rule/DO-NOT-DELETE-S3-Files*"
                Condition:
                  StringEquals:
                    events:ManagedBy: elasticfilesystem.amazonaws.com
              - Sid: EventBridgeRead
                Effect: Allow
                Action:
                  - events:DescribeRule
                  - events:ListRuleNamesByTarget
                  - events:ListRules
                  - events:ListTargetsByRule
                Resource: !Sub "arn:${AWS::Partition}:events:*:*:rule/*"

  S3FileSystem:
    Type: AWS::S3Files::FileSystem
    Properties:
      AcceptBucketWarning: true
      Bucket: !GetAtt DataBucket.Arn
      Prefix: !If [HasS3Prefix, !Ref S3Prefix, !Ref AWS::NoValue]
      RoleArn: !GetAtt S3FilesBucketAccessRole.Arn
      Tags:
        - Key: Name
          Value: !Sub "${NamePrefix}-fs"
        - Key: Project
          Value: !Ref NamePrefix

  S3FilesMountTargetSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${NamePrefix} S3 Files mount target security group"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 2049
          ToPort: 2049
          SourceSecurityGroupId: !Ref ClientSecurityGroupId
          Description: Allow NFS traffic from the S3 Files client security group.
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub "${NamePrefix}-s3files-mount-sg"

  S3FilesMountTarget:
    Type: AWS::S3Files::MountTarget
    Properties:
      FileSystemId: !GetAtt S3FileSystem.FileSystemId
      IpAddressType: IPV4_ONLY
      SecurityGroups:
        - !Ref S3FilesMountTargetSecurityGroup
      SubnetId: !Ref SubnetId

  S3FilesAccessPoint:
    Type: AWS::S3Files::AccessPoint
    Properties:
      FileSystemId: !GetAtt S3FileSystem.FileSystemId
      PosixUser:
        Uid: !Ref PosixUid
        Gid: !Ref PosixGid
      RootDirectory:
        Path: !Ref AccessPointRootDirectory
        CreationPermissions:
          OwnerUid: !Ref PosixUid
          OwnerGid: !Ref PosixGid
          Permissions: !Ref RootDirectoryPermissions
      Tags:
        - Key: Name
          Value: !Sub "${NamePrefix}-access-point"
        - Key: Project
          Value: !Ref NamePrefix

  S3FilesFileSystemPolicy:
    Type: AWS::S3Files::FileSystemPolicy
    Properties:
      FileSystemId: !GetAtt S3FileSystem.FileSystemId
      Policy:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowClientViaAccessPoint
            Effect: Allow
            Principal:
              AWS: !Ref ClientIamRoleArn
            Action:
              - s3files:ClientMount
              - s3files:ClientWrite
            Condition:
              StringEquals:
                s3files:AccessPointArn: !GetAtt S3FilesAccessPoint.AccessPointArn

  ClientS3FilesIdentityPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub "${NamePrefix}-s3files-client"
      Roles:
        - !Ref ClientIamRoleName
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: S3FilesClientAccess
            Effect: Allow
            Action:
              - s3files:ClientMount
              - s3files:ClientWrite
            Resource: !GetAtt S3FileSystem.FileSystemArn
          - Sid: S3DirectReadOptimization
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:GetObjectVersion
            Resource: !Sub "${DataBucket.Arn}/*"
          - Sid: S3BucketListAccess
            Effect: Allow
            Action: s3:ListBucket
            Resource: !GetAtt DataBucket.Arn

Outputs:
  BucketName:
    Description: S3 bucket linked to the S3 Files file system.
    Value: !Ref DataBucket

  FileSystemId:
    Description: S3 Files file system ID.
    Value: !GetAtt S3FileSystem.FileSystemId

  FileSystemArn:
    Description: S3 Files file system ARN.
    Value: !GetAtt S3FileSystem.FileSystemArn

  MountTargetId:
    Description: S3 Files mount target ID.
    Value: !GetAtt S3FilesMountTarget.MountTargetId

  AccessPointId:
    Description: S3 Files access point ID.
    Value: !GetAtt S3FilesAccessPoint.AccessPointId

  AccessPointArn:
    Description: S3 Files access point ARN.
    Value: !GetAtt S3FilesAccessPoint.AccessPointArn

  MountCommand:
    Description: Run on a Linux client with amazon-efs-utils 3.0.0 or later.
    Value: !Sub
      - "sudo mkdir -p /mnt/s3files && sudo mount -t s3files -o accesspoint=${AccessPointId} ${FileSystemId} /mnt/s3files"
      - AccessPointId: !GetAtt S3FilesAccessPoint.AccessPointId
        FileSystemId: !GetAtt S3FileSystem.FileSystemId
