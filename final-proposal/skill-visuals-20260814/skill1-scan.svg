<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M1,1 L13,7 L1,13 Z" fill="#0f766e"/>
    </marker>
    <style>
      .font { font-family: "Microsoft JhengHei", "Noto Sans CJK TC", Arial, sans-serif; }
      .mono { font-family: Consolas, "Microsoft JhengHei", monospace; }
      .title { font-size: 48px; font-weight: 700; fill: #17324d; }
      .subtitle { font-size: 24px; fill: #486479; }
      .lane { font-size: 19px; font-weight: 700; fill: #5e7587; }
      .h { font-size: 25px; font-weight: 700; fill: #16324f; }
      .body { font-size: 19px; fill: #334e5f; }
      .small { font-size: 16px; fill: #4d6575; }
      .tiny { font-size: 14px; fill: #667d8c; }
      .card { fill: #ffffff; stroke: #c7d5df; stroke-width: 2; rx: 8; }
      .accent { fill: #e7f6f4; stroke: #0f766e; stroke-width: 2; rx: 8; }
      .dark { fill: #16324f; rx: 8; }
      .arrow { stroke: #0f766e; stroke-width: 4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#f7f9fb"/>
  <rect x="48" y="36" width="1504" height="96" rx="8" fill="#ffffff" stroke="#d8e2ea"/>
  <text x="82" y="91" class="font title">Skill 1 Scan：把新聞變成可追蹤的候選技術卡</text>
  <text x="84" y="123" class="font subtitle">重點不是推薦採用，而是把公開來源、AI 摘要、架構推論與證據缺口整理成下一關能比較的資料。</text>

  <text x="86" y="178" class="font lane">可信來源</text>
  <text x="410" y="178" class="font lane">AI 擷取與降噪</text>
  <text x="760" y="178" class="font lane">結構化理解</text>
  <text x="1112" y="178" class="font lane">候選 artifact</text>
  <text x="1370" y="178" class="font lane">進入 Skill 2</text>

  <rect x="70" y="205" width="260" height="205" class="card"/>
  <text x="98" y="248" class="font h">輸入材料</text>
  <text x="98" y="292" class="font body">AWS Blog / What's New</text>
  <text x="98" y="326" class="font body">官方文件、公告 URL</text>
  <text x="98" y="360" class="font body">使用者提供的題目</text>
  <text x="98" y="390" class="font small">每筆都保留來源與擷取時間</text>

  <path d="M340 308 H405" class="arrow"/>

  <rect x="430" y="190" width="275" height="235" class="accent"/>
  <text x="458" y="234" class="font h">第一層：去廣告化</text>
  <text x="458" y="278" class="font body">抽出實際新功能</text>
  <text x="458" y="312" class="font body">拆開成效宣稱與事實</text>
  <text x="458" y="346" class="font body">標出「沒有教怎麼做」</text>
  <text x="458" y="380" class="font body">保留必要引用與缺口</text>

  <path d="M716 308 H775" class="arrow"/>

  <rect x="800" y="190" width="275" height="235" class="accent"/>
  <text x="828" y="234" class="font h">第二層：變成技術語言</text>
  <text x="828" y="278" class="font body">中文摘要與前後差異</text>
  <text x="828" y="312" class="font body">推導可能 AWS 元件</text>
  <text x="828" y="346" class="font body">列出驗證需要的證據</text>
  <text x="828" y="380" class="font body">標記成熟度與不確定性</text>

  <path d="M1086 308 H1146" class="arrow"/>

  <rect x="1170" y="205" width="210" height="205" class="dark"/>
  <text x="1200" y="250" class="mono" font-size="24" font-weight="700" fill="#ffffff">s1 candidate</text>
  <text x="1200" y="292" class="font body" fill="#d7e8ef">key_points</text>
  <text x="1200" y="326" class="font body" fill="#d7e8ef">why_it_matters</text>
  <text x="1200" y="360" class="font body" fill="#d7e8ef">evidence_gaps</text>
  <text x="1200" y="390" class="font body" fill="#d7e8ef">source_snapshot</text>

  <path d="M1392 308 H1460" class="arrow"/>

  <rect x="1478" y="240" width="64" height="136" rx="8" fill="#0f766e"/>
  <text x="1510" y="303" class="font" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">S2</text>
  <text x="1510" y="334" class="font tiny" fill="#e7f6f4" text-anchor="middle">比較</text>

  <rect x="70" y="472" width="463" height="180" class="card"/>
  <text x="98" y="515" class="font h">這關會留下什麼證據</text>
  <text x="98" y="557" class="font body">1. 原始 URL、標題、日期、來源可信度</text>
  <text x="98" y="591" class="font body">2. AI 中文摘要與「廣告詞 / 事實」分離</text>
  <text x="98" y="625" class="font body">3. 候選技術可能影響的工作場景與架構推論</text>

  <rect x="568" y="472" width="462" height="180" class="card"/>
  <text x="596" y="515" class="font h">這關刻意不做什麼</text>
  <text x="596" y="557" class="font body">不建立 AWS 資源，不花錢，也不宣稱可落地。</text>
  <text x="596" y="591" class="font body">不因為 AWS 官方新聞就直接推薦 PoC。</text>
  <text x="596" y="625" class="font body">架構若是 AI 推論，會明確標記為 inferred。</text>

  <rect x="1065" y="472" width="477" height="180" class="card"/>
  <text x="1093" y="515" class="font h">成功判準</text>
  <text x="1093" y="557" class="font body">主管或使用者看完候選卡後，能快速回答：</text>
  <text x="1093" y="591" class="font body">這是什麼、跟雲端工作哪裡有關、還缺什麼證據。</text>
  <text x="1093" y="625" class="font body">若只是行銷宣稱，也會在這一關被標成弱證據。</text>

  <path d="M80 712 H1516" stroke="#d5e1e8" stroke-width="2"/>
  <text x="84" y="752" class="mono small">GitHub 檔名：radar-redesign/skills/scan-cloud-technologies/SKILL.md</text>
  <text x="84" y="784" class="font small">一句話：把外部雲端新聞變成可追蹤、可比較、可被人類檢查的候選資料。</text>
  <text x="84" y="816" class="font tiny">在四個案例中，Skill 1 是所有後續時間比較與成功 / 失敗判斷的證據起點。</text>
</svg>
