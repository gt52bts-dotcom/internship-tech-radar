<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M1,1 L13,7 L1,13 Z" fill="#475569"/>
    </marker>
    <style>
      .font { font-family: "Microsoft JhengHei", "Noto Sans CJK TC", Arial, sans-serif; }
      .mono { font-family: Consolas, "Microsoft JhengHei", monospace; }
      .title { font-size: 48px; font-weight: 700; fill: #26272b; }
      .subtitle { font-size: 24px; fill: #5d6068; }
      .lane { font-size: 19px; font-weight: 700; fill: #6e7380; }
      .h { font-size: 25px; font-weight: 700; fill: #26272b; }
      .body { font-size: 19px; fill: #3f424a; }
      .small { font-size: 16px; fill: #5d6068; }
      .tiny { font-size: 14px; fill: #70757f; }
      .card { fill: #ffffff; stroke: #cbcdd3; stroke-width: 2; rx: 8; }
      .accent { fill: #eef2f7; stroke: #475569; stroke-width: 2; rx: 8; }
      .status { fill: #ecfdf5; stroke: #15803d; stroke-width: 2; rx: 8; }
      .warn { fill: #fff7ed; stroke: #d97706; stroke-width: 2; rx: 8; }
      .dark { fill: #26272b; rx: 8; }
      .arrow { stroke: #475569; stroke-width: 4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#f7f7f8"/>
  <rect x="48" y="36" width="1504" height="96" rx="8" fill="#ffffff" stroke="#d9dce2"/>
  <text x="82" y="91" class="font title">Skill 5 Report：把證據鏈整理成主管看得懂的結論</text>
  <text x="84" y="123" class="font subtitle">最後一關不新增幻想，也不補沒有做過的驗證；它把 Skill 1 到 Skill 4 的證據轉成決策報告與簡報素材。</text>

  <text x="82" y="178" class="font lane">證據來源</text>
  <text x="402" y="178" class="font lane">證據帳本</text>
  <text x="740" y="178" class="font lane">狀態標籤</text>
  <text x="1070" y="178" class="font lane">中文報告</text>
  <text x="1374" y="178" class="font lane">交付與提問</text>

  <rect x="70" y="200" width="275" height="245" class="card"/>
  <text x="98" y="243" class="font h">輸入證據</text>
  <text x="98" y="287" class="mono" font-size="18" fill="#3f424a">S1 source + summary</text>
  <text x="98" y="321" class="mono" font-size="18" fill="#3f424a">S2 comparison matrix</text>
  <text x="98" y="355" class="mono" font-size="18" fill="#3f424a">S3 decision report</text>
  <text x="98" y="389" class="mono" font-size="18" fill="#3f424a">S4 runtime / cleanup</text>
  <text x="98" y="421" class="font small">失敗案例可停在 Skill 3。</text>

  <path d="M356 322 H424" class="arrow"/>

  <rect x="450" y="188" width="258" height="270" class="accent"/>
  <text x="478" y="230" class="font h">證據帳本整理</text>
  <text x="478" y="274" class="font body">來源事實</text>
  <text x="478" y="308" class="font body">AI 推論</text>
  <text x="478" y="342" class="font body">人工選擇</text>
  <text x="478" y="376" class="font body">PoC 結果</text>
  <text x="478" y="410" class="font body">限制與未驗證事項</text>

  <path d="M720 322 H782" class="arrow"/>

  <rect x="808" y="188" width="250" height="270" class="status"/>
  <text x="836" y="230" class="font h">三種可信狀態</text>
  <text x="836" y="274" class="font body">已驗證：本機或 AWS PoC 有證據</text>
  <text x="836" y="320" class="font body">已實作但待公司環境驗證</text>
  <text x="836" y="366" class="font body">估算 / 預期：清楚標示</text>
  <text x="836" y="414" class="font small">避免把推論講成事實。</text>

  <path d="M1070 322 H1130" class="arrow"/>

  <rect x="1156" y="200" width="235" height="245" class="accent"/>
  <text x="1184" y="243" class="font h">報告內容</text>
  <text x="1184" y="287" class="font body">技術目的與架構</text>
  <text x="1184" y="321" class="font body">如何使用與實作成果</text>
  <text x="1184" y="355" class="font body">時間節省與整體成效</text>
  <text x="1184" y="389" class="font body">成功 / 失敗案例</text>
  <text x="1184" y="421" class="font small">中文寫給人看，不只是 JSON。</text>

  <path d="M1402 322 H1452" class="arrow"/>

  <rect x="1470" y="224" width="72" height="190" rx="8" fill="#475569"/>
  <text x="1506" y="286" class="font" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">HTML</text>
  <text x="1506" y="322" class="font tiny" fill="#eef2f7" text-anchor="middle">MD</text>
  <text x="1506" y="358" class="font tiny" fill="#eef2f7" text-anchor="middle">slides</text>

  <rect x="70" y="500" width="348" height="155" class="card"/>
  <text x="98" y="542" class="font h">成功案例怎麼呈現</text>
  <text x="98" y="584" class="font body">Lambda、S3 要一路帶到 Skill 5，</text>
  <text x="98" y="618" class="font body">讓主管看到從新聞到 PoC 證據的完整鏈。</text>

  <rect x="448" y="500" width="348" height="155" class="warn"/>
  <text x="476" y="542" class="font h">失敗案例怎麼呈現</text>
  <text x="476" y="584" class="font body">不是沒做完，而是 Skill 3 判斷不該硬做。</text>
  <text x="476" y="618" class="font body">報告要說明「停止」本身節省了時間和成本。</text>

  <rect x="826" y="500" width="348" height="155" class="card"/>
  <text x="854" y="542" class="font h">這關不做什麼</text>
  <text x="854" y="584" class="font body">不捏造帳單、不聲稱公司環境已驗證。</text>
  <text x="854" y="618" class="font body">不把 AWS 宣傳詞改寫成實作成果。</text>

  <rect x="1204" y="500" width="338" height="155" class="dark"/>
  <text x="1232" y="542" class="font h" fill="#ffffff">主管能帶走什麼</text>
  <text x="1232" y="584" class="font body" fill="#e2e8f0">一套可重複的技術雷達流程，</text>
  <text x="1232" y="618" class="font body" fill="#e2e8f0">以及哪些技術值得繼續投入。</text>

  <path d="M80 712 H1516" stroke="#d9dce2" stroke-width="2"/>
  <text x="84" y="752" class="mono small">GitHub 檔名：radar-redesign/skills/report-cloud-evidence/SKILL.md</text>
  <text x="84" y="784" class="font small">一句話：把前四關留下的來源、比較、決策、PoC 證據，整理成可交付主管、可回答追問的中文報告。</text>
  <text x="84" y="816" class="font tiny">這張圖支撐 8/14 簡報收尾：成果不是單一 demo，而是一條可追蹤的雲端技術評估管線。</text>
</svg>
