<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M1,1 L13,7 L1,13 Z" fill="#b45309"/>
    </marker>
    <style>
      .font { font-family: "Microsoft JhengHei", "Noto Sans CJK TC", Arial, sans-serif; }
      .mono { font-family: Consolas, "Microsoft JhengHei", monospace; }
      .title { font-size: 48px; font-weight: 700; fill: #2f2a1f; }
      .subtitle { font-size: 24px; fill: #665947; }
      .lane { font-size: 19px; font-weight: 700; fill: #80694b; }
      .h { font-size: 25px; font-weight: 700; fill: #3d2d19; }
      .body { font-size: 19px; fill: #5c4930; }
      .small { font-size: 16px; fill: #6f5a3d; }
      .tiny { font-size: 14px; fill: #82705a; }
      .card { fill: #ffffff; stroke: #ddcbaa; stroke-width: 2; rx: 8; }
      .accent { fill: #fff4df; stroke: #b45309; stroke-width: 2; rx: 8; }
      .dark { fill: #2f2a1f; rx: 8; }
      .arrow { stroke: #b45309; stroke-width: 4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#fbf8f2"/>
  <rect x="48" y="36" width="1504" height="96" rx="8" fill="#ffffff" stroke="#e5d8c2"/>
  <text x="82" y="91" class="font title">Skill 2 Compare：把多個候選放到同一把尺上</text>
  <text x="84" y="123" class="font subtitle">重點不是幫人選答案，而是讓人能看見候選差異、證據缺口、成本能見度與 PoC 可行性。</text>

  <text x="84" y="178" class="font lane">來自 Skill 1</text>
  <text x="386" y="178" class="font lane">比較矩陣</text>
  <text x="764" y="178" class="font lane">風險與缺口</text>
  <text x="1106" y="178" class="font lane">人類挑核心</text>
  <text x="1370" y="178" class="font lane">單一候選進 S3</text>

  <rect x="70" y="205" width="245" height="228" class="card"/>
  <text x="98" y="248" class="font h">候選清單</text>
  <text x="98" y="292" class="mono" font-size="18" fill="#5c4930">candidate A</text>
  <text x="98" y="326" class="mono" font-size="18" fill="#5c4930">candidate B</text>
  <text x="98" y="360" class="mono" font-size="18" fill="#5c4930">candidate C</text>
  <text x="98" y="396" class="font small">每個候選都有來源與摘要</text>

  <path d="M326 318 H390" class="arrow"/>

  <rect x="415" y="188" width="305" height="262" class="accent"/>
  <text x="443" y="230" class="font h">四個比較面向</text>
  <text x="443" y="274" class="font body">1. 技術價值與工作關聯</text>
  <text x="443" y="308" class="font body">2. 實作路徑是否清楚</text>
  <text x="443" y="342" class="font body">3. Region / 價格可查性</text>
  <text x="443" y="376" class="font body">4. 風險、前提與停止條件</text>
  <text x="443" y="416" class="font small">同一欄位比較，避免只看熱度。</text>

  <path d="M732 318 H778" class="arrow"/>

  <rect x="803" y="188" width="285" height="262" class="accent"/>
  <text x="831" y="230" class="font h">找出不該硬做的原因</text>
  <text x="831" y="274" class="font body">缺官方 recipe</text>
  <text x="831" y="308" class="font body">只有廣告成效宣稱</text>
  <text x="831" y="342" class="font body">一開資源就有月費</text>
  <text x="831" y="376" class="font body">PoC 成效無法量測</text>
  <text x="831" y="416" class="font small">這些會被帶到 Skill 3 深評。</text>

  <path d="M1100 318 H1150" class="arrow"/>

  <rect x="1175" y="205" width="185" height="228" class="card"/>
  <text x="1202" y="248" class="font h">人類決策</text>
  <text x="1202" y="292" class="font body">挑一個核心</text>
  <text x="1202" y="326" class="font body">明確說理由</text>
  <text x="1202" y="360" class="font body">留下選擇紀錄</text>
  <text x="1202" y="396" class="font small">AI 不自動代選。</text>

  <path d="M1372 318 H1444" class="arrow"/>

  <rect x="1462" y="240" width="80" height="150" rx="8" fill="#b45309"/>
  <text x="1502" y="304" class="font" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">S3</text>
  <text x="1502" y="336" class="font tiny" fill="#fff4df" text-anchor="middle">深評</text>

  <rect x="70" y="496" width="345" height="155" class="card"/>
  <text x="98" y="538" class="font h">輸出 artifact</text>
  <text x="98" y="580" class="font body">比較表、排序脈絡、證據缺口</text>
  <text x="98" y="614" class="font body">以及「為什麼暫時不選」的理由</text>

  <rect x="445" y="496" width="345" height="155" class="card"/>
  <text x="473" y="538" class="font h">跟手動流程的差異</text>
  <text x="473" y="580" class="font body">人不用逐篇重讀來源。</text>
  <text x="473" y="614" class="font body">可以直接針對關鍵缺口做判斷。</text>

  <rect x="820" y="496" width="345" height="155" class="card"/>
  <text x="848" y="538" class="font h">這關的邊界</text>
  <text x="848" y="580" class="font body">不讓多個候選一起進 Skill 3。</text>
  <text x="848" y="614" class="font body">不因新、不因 AWS 官方就放行。</text>

  <rect x="1195" y="496" width="347" height="155" class="dark"/>
  <text x="1223" y="538" class="font h" fill="#ffffff">成功判準</text>
  <text x="1223" y="580" class="font body" fill="#faead0">主管能看懂候選差異，</text>
  <text x="1223" y="614" class="font body" fill="#faead0">並知道為何只挑一個進深評。</text>

  <path d="M80 712 H1516" stroke="#e4d4b8" stroke-width="2"/>
  <text x="84" y="752" class="mono small">GitHub 檔名：radar-redesign/skills/compare-cloud-candidates/SKILL.md</text>
  <text x="84" y="784" class="font small">一句話：把多個候選整理成可比較的決策矩陣，讓人類挑出真正值得深評的一個核心案例。</text>
  <text x="84" y="816" class="font tiny">這張圖也支撐你簡報中「Skill 3 之後只評估單一候選」的設計原則。</text>
</svg>
