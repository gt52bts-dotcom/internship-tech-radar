<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M1,1 L13,7 L1,13 Z" fill="#6d5bd0"/>
    </marker>
    <marker id="stoparrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M1,1 L13,7 L1,13 Z" fill="#b91c1c"/>
    </marker>
    <style>
      .font { font-family: "Microsoft JhengHei", "Noto Sans CJK TC", Arial, sans-serif; }
      .mono { font-family: Consolas, "Microsoft JhengHei", monospace; }
      .title { font-size: 48px; font-weight: 700; fill: #2d2353; }
      .subtitle { font-size: 24px; fill: #625880; }
      .lane { font-size: 19px; font-weight: 700; fill: #756b94; }
      .h { font-size: 25px; font-weight: 700; fill: #2d2353; }
      .body { font-size: 19px; fill: #463d66; }
      .small { font-size: 16px; fill: #625880; }
      .tiny { font-size: 14px; fill: #756b94; }
      .card { fill: #ffffff; stroke: #cdc4ef; stroke-width: 2; rx: 8; }
      .accent { fill: #f0edff; stroke: #6d5bd0; stroke-width: 2; rx: 8; }
      .gate { fill: #fff7ed; stroke: #d97706; stroke-width: 2; rx: 8; }
      .stop { fill: #fff1f2; stroke: #b91c1c; stroke-width: 2; rx: 8; }
      .dark { fill: #2d2353; rx: 8; }
      .arrow { stroke: #6d5bd0; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .stopline { stroke: #b91c1c; stroke-width: 4; fill: none; marker-end: url(#stoparrow); }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#f8f7ff"/>
  <rect x="48" y="36" width="1504" height="96" rx="8" fill="#ffffff" stroke="#dad4f4"/>
  <text x="82" y="91" class="font title">Skill 3 Evaluate：PoC 前的決策報告與放行閘門</text>
  <text x="84" y="123" class="font subtitle">這是你說最清楚的那種報告形式：先讓人看懂價值、證據、成本、風險，再決定要不要進 Skill 4。</text>

  <text x="84" y="178" class="font lane">單一候選</text>
  <text x="355" y="178" class="font lane">深度評估</text>
  <text x="760" y="178" class="font lane">PoC 問題設計</text>
  <text x="1110" y="178" class="font lane">HTML 決策報告</text>
  <text x="1390" y="178" class="font lane">Go / Stop</text>

  <rect x="70" y="205" width="240" height="220" class="card"/>
  <text x="98" y="248" class="font h">人類已挑選</text>
  <text x="98" y="292" class="font body">只處理一個候選</text>
  <text x="98" y="326" class="font body">帶入 Skill 2 脈絡</text>
  <text x="98" y="360" class="font body">保留原始來源</text>
  <text x="98" y="396" class="font small">避免 AI 自己跳題。</text>

  <path d="M320 315 H374" class="arrow"/>

  <rect x="400" y="185" width="310" height="260" class="accent"/>
  <text x="428" y="228" class="font h">五個評估面向</text>
  <text x="428" y="272" class="font body">技術價值：是否解決真問題</text>
  <text x="428" y="306" class="font body">可驗證性：能不能小規模證明</text>
  <text x="428" y="340" class="font body">採用前提：權限、Region、資料</text>
  <text x="428" y="374" class="font body">可控性：成本與資源範圍</text>
  <text x="428" y="408" class="font body">可逆性：能否乾淨清除</text>

  <path d="M722 315 H776" class="arrow"/>

  <rect x="802" y="185" width="300" height="260" class="gate"/>
  <text x="830" y="228" class="font h">PoC 前必答問題</text>
  <text x="830" y="272" class="font body">官方是否有可部署 recipe</text>
  <text x="830" y="306" class="font body">預期預算是否先可估</text>
  <text x="830" y="340" class="font body">PoC 要證明哪個指標</text>
  <text x="830" y="374" class="font body">失敗或不划算時怎麼停</text>
  <text x="830" y="408" class="font small">這裡定義「硬做」的邊界。</text>

  <path d="M1114 315 H1168" class="arrow"/>

  <rect x="1194" y="205" width="230" height="220" class="dark"/>
  <text x="1222" y="248" class="mono" font-size="22" font-weight="700" fill="#ffffff">skill3 report</text>
  <text x="1222" y="292" class="font body" fill="#e8e1ff">人看得懂的中文</text>
  <text x="1222" y="326" class="font body" fill="#e8e1ff">分數與引用證據</text>
  <text x="1222" y="360" class="font body" fill="#e8e1ff">Go / Stop 建議</text>
  <text x="1222" y="396" class="font small" fill="#d8d0ff">Skill 4 前先交報告。</text>

  <path d="M1436 315 H1482" class="arrow"/>
  <rect x="1494" y="232" width="48" height="74" rx="8" fill="#15803d"/>
  <text x="1518" y="278" class="font" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">GO</text>
  <rect x="1494" y="326" width="48" height="74" rx="8" fill="#b91c1c"/>
  <text x="1518" y="372" class="font" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">停</text>

  <rect x="70" y="492" width="350" height="160" class="card"/>
  <text x="98" y="534" class="font h">放行條件</text>
  <text x="98" y="576" class="font body">評分達標、無重大阻擋、預算可控。</text>
  <text x="98" y="610" class="font body">PoC recipe 明確，且人類核准後才進 S4。</text>

  <rect x="450" y="492" width="350" height="160" class="stop"/>
  <text x="478" y="534" class="font h" fill="#7f1d1d">擋下條件</text>
  <text x="478" y="576" class="font body" fill="#7f1d1d">只有宣傳詞、沒有實作方法。</text>
  <text x="478" y="610" class="font body" fill="#7f1d1d">一開資源就收月費，且預期成效不大。</text>

  <rect x="830" y="492" width="350" height="160" class="card"/>
  <text x="858" y="534" class="font h">四案例中的用法</text>
  <text x="858" y="576" class="font body">Lambda / S3：進 Skill 4 驗證。</text>
  <text x="858" y="610" class="font body">兩個失敗案例：到 Skill 3 後停止。</text>

  <rect x="1210" y="492" width="332" height="160" class="card"/>
  <text x="1238" y="534" class="font h">對主管的價值</text>
  <text x="1238" y="576" class="font body">不是炫耀 AI 做了什麼，</text>
  <text x="1238" y="610" class="font body">而是證明 AI 能幫忙避免錯誤 PoC。</text>

  <path d="M80 712 H1516" stroke="#dad4f4" stroke-width="2"/>
  <text x="84" y="752" class="mono small">GitHub 檔名：radar-redesign/skills/evaluate-cloud-candidate/SKILL.md</text>
  <text x="84" y="784" class="font small">一句話：在花錢和開資源前，用中文決策報告回答「值不值得做、要證明什麼、何時該停止」。</text>
  <text x="84" y="816" class="font tiny">這張圖可直接銜接你要展示的 Skill 3 HTML 成果報告。</text>
</svg>
