<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Agentic 雲端技術雷達與評估系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Noto+Sans+TC:wght@500;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="radar-adapter.css">
<style>
  :root{
    --wall:#EDEFF2; --wall2:#E2E6EB; --warm:rgba(255,238,205,.55);
    --stone-top:#B2BDCC; --stone-face:#7F8DA2; --stone-face2:#6B7789; --stone-sh:rgba(50,65,90,.26);
    --wood:#AE7D4C; --wood-d:#8A5E38;
    --blue:#5B8DEF; --blue-l:#83AAF4; --blue-d:#3E6FD0;
    --red:#EC7361; --red-l:#F49A8C; --red-d:#CF5340;
    --green:#5FBE7E; --green-d:#3C9A5C;
    --gold:#F5C361; --gold-d:#DFA338;
    --ink:#33414F; --ink-soft:#63748A; --ink-faint:#9AA8B8;
    --board:#FBFCFE; --board-line:#E6EAF0; --board-head:#2C3A4A;
    --ball:#FEFEFA; --ball-sh:#E4E8EE; --eye:#3B3F46;
    --disp:"Baloo 2","Noto Sans TC",sans-serif;
    --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--sans);color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased;
    background:radial-gradient(70% 60% at 82% 6%,#FBF3E2 0%,var(--wall) 42%,var(--wall2) 100%)}
  .app{height:100vh;display:flex;flex-direction:column;position:relative}
  .light{position:fixed;top:-10%;right:4%;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,var(--warm),transparent 66%);filter:blur(12px);pointer-events:none;z-index:0}
  .deco{position:fixed;pointer-events:none;opacity:.55;z-index:0}

  .top{display:flex;align-items:center;gap:14px;padding:11px 22px;z-index:20;position:relative}
  .brand{display:flex;align-items:center;gap:11px}
  .brand .mk{width:34px;height:34px}
  .brand .t1{font-family:var(--disp);font-weight:800;font-size:16.5px;color:var(--ink)}
  .brand .t1 small{display:block;font-size:9px;color:var(--ink-faint);letter-spacing:.13em;font-weight:600}
  .dots{display:flex;gap:6px}
  .dots i{width:22px;height:11px;border-radius:4px;background:#D3D9E1;transition:.3s}
  .dots i.on{background:var(--gold)}.dots i.done{background:var(--green)}
  .tgap{flex:1}
  .pts{font-family:var(--disp);font-weight:800;font-size:16px;color:var(--gold-d);display:flex;align-items:center;gap:5px}
  .counter{background:#fff;border-radius:13px;padding:7px 15px;box-shadow:0 5px 14px var(--stone-sh);text-align:center;font-family:var(--disp)}
  .counter .n{font-weight:800;font-size:19px;color:var(--blue-d);line-height:1}
  .counter .l{font-size:8.5px;color:var(--ink-faint);letter-spacing:.08em;font-weight:600}
  .sndbtn{border:0;background:#fff;border-radius:12px;width:36px;height:32px;font-size:15px;cursor:pointer;box-shadow:0 4px 12px var(--stone-sh);transition:.2s}
  .sndbtn:hover{transform:translateY(-2px)}
  .sndbtn.off{opacity:.45}
  .sndbtn.need{animation:needpulse 1.3s ease-in-out infinite}
  @keyframes needpulse{0%,100%{box-shadow:0 4px 12px var(--stone-sh)}50%{box-shadow:0 0 0 5px rgba(245,195,97,.4),0 4px 12px var(--stone-sh)}}
  .scen{display:flex;align-items:center;gap:7px;font-family:var(--disp);font-weight:600;font-size:11px;color:var(--ink-soft)}
  .toggle{display:inline-flex;background:#fff;border-radius:99px;padding:3px;box-shadow:0 4px 12px var(--stone-sh)}
  .toggle button{border:0;background:transparent;color:var(--ink-soft);font-family:var(--disp);font-weight:700;font-size:11px;padding:5px 12px;border-radius:99px;cursor:pointer;transition:.2s}
  .toggle button.on[data-v="pass"]{background:var(--green);color:#fff}
  .toggle button.on[data-v="fail"]{background:var(--red-d);color:#fff}

  .main{flex:1;display:flex;min-height:0;gap:0}

  /* Live board */
  .board{width:340px;min-width:300px;margin:6px 0 14px 18px;background:var(--board);border-radius:20px;box-shadow:0 14px 34px var(--stone-sh),0 2px 0 rgba(255,255,255,.8) inset;display:flex;flex-direction:column;overflow:hidden;z-index:10}
  .board .bhead{background:linear-gradient(180deg,var(--board-head),#22303E);color:#fff;padding:13px 17px}
  .board .bhead .win{display:flex;gap:6px;margin-bottom:9px}
  .board .bhead .win i{width:9px;height:9px;border-radius:50%}
  .board .bhead .win i:nth-child(1){background:#FF6159}.board .bhead .win i:nth-child(2){background:#FFBD2E}.board .bhead .win i:nth-child(3){background:#28C940}
  .board .bhead .bt{font-family:var(--disp);font-weight:800;font-size:15px;display:flex;align-items:center;gap:8px}
  .board .bhead .bt .run{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .board .bhead .bs{font-family:var(--mono);font-size:10px;opacity:.7;margin-top:3px;letter-spacing:.02em}
  .board .log{flex:1;overflow-y:auto;padding:14px 16px;font-family:var(--mono);font-size:11.5px;line-height:1.75;color:var(--ink)}
  .board .log .ln{opacity:0;animation:lin .35s ease forwards;white-space:pre-wrap;word-break:break-word}
  @keyframes lin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .board .log .ln.h{color:var(--ink-faint)}
  .board .log .ln .ok{color:var(--green-d);font-weight:600}
  .board .log .ln .num{color:var(--gold-d);font-weight:600}
  .board .log .ln .no{color:var(--red-d);font-weight:600}
  .board .log .ln.sum{color:var(--blue-d);font-weight:700;margin-top:3px}
  .board .metrics{border-top:1px solid var(--board-line);padding:11px 16px;display:flex;gap:9px;flex-wrap:wrap}
  .board .m{flex:1;min-width:70px;background:#F3F6FB;border-radius:11px;padding:8px 10px}
  .board .m .mk{font-family:var(--mono);font-size:8.5px;color:var(--ink-faint);letter-spacing:.05em}
  .board .m .mv{font-family:var(--disp);font-weight:800;font-size:16px;color:var(--blue-d)}

  /* Scene */
  .scene{flex:1;position:relative;overflow:hidden;min-height:460px}
  .hint{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:15;background:#fff;border-radius:15px;padding:8px 18px;box-shadow:0 8px 18px var(--stone-sh);font-family:var(--disp);font-weight:700;font-size:13px;color:var(--ink);max-width:80%;text-align:center}
  .hint b{color:var(--green-d)}

  .plat{position:absolute;z-index:5}
  .plat .ptop{width:128px;height:28px;background:radial-gradient(60% 100% at 50% 42%,var(--stone-top),#9CAABB);border-radius:50%;position:relative;z-index:2}
  .plat .pface{width:128px;height:42px;margin-top:-14px;background:linear-gradient(180deg,var(--stone-face),var(--stone-face2));border-radius:0 0 18px 18px;box-shadow:0 14px 22px var(--stone-sh);position:relative}
  .plat .pface::after{content:"";position:absolute;left:14px;top:8px;width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.1)}
  .plat.active .ptop{background:radial-gradient(60% 100% at 50% 42%,#D6E0EC,#B9C6D6)}
  .plat.active{animation:glowp 1.6s ease-in-out infinite}
  @keyframes glowp{0%,100%{filter:drop-shadow(0 0 0 rgba(245,195,97,0))}50%{filter:drop-shadow(0 0 14px rgba(245,195,97,.55))}}

  .sign{position:absolute;z-index:6;width:132px}
  .sign .card{background:#fff;border-radius:13px;padding:8px 10px;box-shadow:0 8px 16px var(--stone-sh);}
  .sign.active .card{box-shadow:0 0 0 3px rgba(245,195,97,.45),0 10px 18px var(--stone-sh)}
  .sign .hd{display:flex;align-items:center;gap:6px}
  .sign .num{width:18px;height:18px;border-radius:6px;background:var(--ink);color:#fff;font-family:var(--disp);font-weight:800;font-size:10.5px;display:flex;align-items:center;justify-content:center;flex:none}
  .sign.done .num{background:var(--green-d)}.sign.active .num{background:var(--gold-d)}
  .sign .nm{font-family:var(--disp);font-weight:800;font-size:12.5px}
  .sign .en{font-family:var(--disp);font-weight:600;font-size:8px;color:var(--ink-faint);letter-spacing:.09em}
  .sign .post{width:5px;height:20px;background:linear-gradient(180deg,#A9B4C2,#8592A2);margin:0 auto;border-radius:3px}

  #goal{position:absolute;z-index:6;display:flex;flex-direction:column;align-items:center}
  #goal .pole{width:4px;height:50px;background:linear-gradient(180deg,#B4BFCC,#8592A2);border-radius:3px}
  #goal .flag{position:absolute;top:2px;left:4px;width:0;height:0;border-top:14px solid transparent;border-bottom:14px solid transparent;border-left:32px solid var(--green);filter:drop-shadow(0 3px 4px rgba(0,0,0,.2))}
  #goal .flag::after{content:"GOAL!";position:absolute;left:-30px;top:-7px;color:#fff;font-family:var(--disp);font-weight:800;font-size:8.5px}

  #yuan{position:absolute;z-index:9;width:72px}
  #yuan svg{width:100%;filter:drop-shadow(0 8px 8px var(--stone-sh))}
  #yuan.bob{animation:bob 2s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  #yuan.vib svg{animation:vib .22s ease}
  #yuan.squash svg{animation:squash .26s ease}
  @keyframes squash{0%{transform:scale(1,1)}32%{transform:scale(1.24,.72)}66%{transform:scale(.93,1.09)}100%{transform:scale(1,1)}}
  .dust{position:fixed;width:11px;height:11px;border-radius:50%;background:rgba(255,255,255,.9);z-index:58;pointer-events:none;animation:dustp .55s ease-out forwards}
  @keyframes dustp{0%{opacity:.9;transform:scale(.35)}100%{opacity:0;transform:scale(2.4) translateY(-8px)}}
  @keyframes vib{0%,100%{transform:translateX(0)}25%{transform:translate(3px,-1px)}75%{transform:translate(-3px,1px)}}
  #yuan .m-open,#yuan .m-sad{display:none}
  #yuan.chomp .m-open{display:block;transform-box:fill-box;transform-origin:center;animation:mopen .18s cubic-bezier(.2,1.7,.4,1)}
  @keyframes mopen{0%{transform:scale(.12)}68%{transform:scale(1.1)}100%{transform:scale(1)}}
  #yuan .eyes{transition:transform .14s cubic-bezier(.3,1.5,.5,1)}
  #yuan.chomp .eyes{transform:translateY(-12px)}
  #yuan.sad .m-sad{display:block}#yuan.sad .eyeHi{opacity:0}
  #yuan .arm{transition:transform .3s cubic-bezier(.34,1.6,.5,1);transform-origin:50px 56px}
  #yuan.cheer .armL{transform:rotate(50deg)}#yuan.cheer .armR{transform:rotate(-50deg)}
  .yspk{position:absolute;font-size:14px;opacity:0;pointer-events:none;z-index:10}
  #yuan.cheer ~ .yspk{animation:ysp .8s ease}
  @keyframes ysp{0%{opacity:0;transform:scale(.4)}45%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}

  #pile{position:absolute;z-index:8}
  .pcube{position:absolute;border-radius:5px;animation:pdrop .3s cubic-bezier(.34,1.56,.5,1);box-shadow:0 2px 0 rgba(0,0,0,.14)}
  @keyframes pdrop{0%{transform:translateY(-30px) scale(.5);opacity:0}100%{transform:none;opacity:1}}

  .belt{position:absolute;left:0;right:0;bottom:0;height:50px;z-index:4;background:linear-gradient(180deg,#6E7B8E,#55606F);box-shadow:0 -3px 10px rgba(0,0,0,.12)}
  .belt .tread{position:absolute;top:0;left:0;height:5px;width:200%;background:repeating-linear-gradient(90deg,#4A5563 0 4px,transparent 4px 28px);animation:tm .8s linear infinite}
  #blocks{position:absolute;left:0;right:0;bottom:42px;height:56px;z-index:5}
  .block{position:absolute;bottom:0;will-change:transform}
  .block .cube{width:50px;min-height:34px;border-radius:9px;position:relative;color:#fff;font-family:var(--disp);font-weight:800;font-size:9px;text-align:center;padding:6px 3px;line-height:1.15;box-shadow:0 5px 0 rgba(0,0,0,.16),0 7px 11px rgba(0,0,0,.14);border:2px solid rgba(255,255,255,.4)}
  .block.blue .cube{background:linear-gradient(155deg,var(--blue-l),var(--blue-d))}
  .block.red .cube{background:linear-gradient(155deg,var(--red-l),var(--red-d))}
  .block .cube::before{content:"";position:absolute;top:4px;left:6px;width:15px;height:5px;border-radius:5px;background:rgba(255,255,255,.5)}
  @keyframes tm{to{transform:translateX(-28px)}}

  #cart{position:absolute;z-index:7;width:116px}
  #cart .basket{background:linear-gradient(180deg,var(--wood),var(--wood-d));border-radius:8px 8px 16px 16px;height:54px;box-shadow:0 10px 20px var(--stone-sh),0 2px 0 rgba(255,255,255,.2) inset;display:flex;flex-wrap:wrap;align-content:flex-end;gap:3px;padding:5px;overflow:hidden;border:2px solid #9C7040}
  #cart .whl{position:absolute;bottom:-11px;width:15px;height:15px;background:#3f3626;border-radius:50%;box-shadow:0 2px 4px rgba(0,0,0,.25)}
  #cart .whl.l{left:16px}#cart .whl.r{right:16px}
  #cart .it{width:13px;height:11px;border-radius:3px;animation:pdrop .3s cubic-bezier(.34,1.56,.5,1)}
  #cart.bump{animation:cb .3s ease}@keyframes cb{0%,100%{}40%{transform:translateY(-6px)}}

  .fly{position:fixed;width:26px;height:22px;border-radius:6px;z-index:60;pointer-events:none;box-shadow:0 4px 8px rgba(0,0,0,.2);border:2px solid rgba(255,255,255,.4)}
  .ring{position:fixed;width:16px;height:16px;border-radius:50%;border:3px solid var(--gold);z-index:55;pointer-events:none;animation:ring .55s ease-out forwards}
  @keyframes ring{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:scale(3)}}
  .floater{position:fixed;font-family:var(--disp);font-weight:800;font-size:16px;color:var(--gold-d);z-index:60;pointer-events:none;animation:fl .9s ease forwards}
  @keyframes fl{0%{opacity:0;transform:scale(.6)}30%{opacity:1;transform:translateY(-12px)}100%{opacity:0;transform:translateY(-40px)}}
  .confetti{position:fixed;width:10px;height:14px;border-radius:3px;z-index:200;pointer-events:none;animation:conf 1.7s ease-out forwards}
  @keyframes conf{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:0;transform:translateY(340px) rotate(560deg)}}
  .scene.shake{animation:sh .2s ease}@keyframes sh{0%,100%{}30%{transform:translate(2px,-1px)}70%{transform:translate(-2px,1px)}}

  .overlay{position:fixed;inset:0;background:rgba(44,58,74,.44);backdrop-filter:blur(6px);z-index:100;display:none;align-items:center;justify-content:center;padding:24px}
  .overlay.show{display:flex;animation:fd .35s ease}@keyframes fd{from{opacity:0}to{opacity:1}}
  .final{background:#fff;border-radius:28px;max-width:520px;width:100%;padding:34px;text-align:center;box-shadow:0 30px 70px rgba(0,0,0,.3);animation:ri .5s cubic-bezier(.2,1.4,.4,1)}
  @keyframes ri{from{opacity:0;transform:translateY(30px) scale(.92)}to{opacity:1}}
  .final .la{width:140px;height:140px;margin:0 auto 4px}.final .la svg{width:100%;height:100%}
  .final .yay{font-family:var(--disp);font-weight:800;font-size:29px;color:var(--gold-d)}.final.fail .yay{color:var(--red-d)}
  .final .msg{font-size:16px;line-height:1.6;margin-top:10px}.final .msg b{color:var(--green-d)}.final.fail .msg b{color:var(--red-d)}
  .final .stars{margin:16px 0 4px;display:flex;gap:6px;justify-content:center}.final .stars svg{width:36px;height:36px}
  .final .rate{font-family:var(--disp);font-weight:700;font-size:14px;color:var(--ink-soft)}
  .final .fb{margin-top:22px;display:flex;gap:11px;justify-content:center;flex-wrap:wrap}
  .fbtn{font-family:var(--disp);font-weight:700;font-size:14px;border:0;border-radius:14px;padding:12px 22px;cursor:pointer;transition:transform .15s}
  .fbtn:hover{transform:translateY(-2px)}.fbtn-p{background:var(--green-d);color:#fff}.fbtn-g{background:#EBEFF4;color:var(--ink)}
  .report{background:#fff;border-radius:22px;max-width:600px;width:100%;max-height:88vh;overflow-y:auto;padding:28px 32px;box-shadow:0 30px 70px rgba(0,0,0,.3);text-align:left}
  .report h3{font-family:var(--disp);font-weight:800;font-size:20px;color:var(--green-d);display:flex;justify-content:space-between;align-items:center}
  .report h3 .x{cursor:pointer;font-size:19px;color:var(--ink-faint);background:none;border:0}
  .report .meta{font-size:11px;color:var(--ink-faint);margin:6px 0 16px;line-height:1.6}
  .rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-bottom:16px}
  .rcell{border-radius:14px;padding:13px;background:#F3F6FB}
  .rcell .k{font-family:var(--disp);font-weight:600;font-size:10px;color:var(--ink-faint)}
  .rcell .v{font-family:var(--disp);font-weight:800;font-size:20px;margin-top:4px}
  .rcell .v.q{color:var(--green-d)}.rcell .v.s{color:var(--gold-d)}.rcell .v.g.pass{color:var(--green-d)}.rcell .v.g.fail{color:var(--red-d)}
  .rb{margin-bottom:14px}.rb .bk{font-family:var(--disp);font-weight:700;font-size:11px;color:var(--gold-d);margin-bottom:6px}
  .rb .reco{display:grid;gap:6px}.rb .reco .r{display:flex;gap:10px;font-size:13.5px;line-height:1.5}.rb .reco .r b{color:var(--green-d);font-family:var(--disp);font-size:12px;flex:none}
  .rb p{font-size:13.5px;line-height:1.7}.rb .risks{display:grid;gap:5px}.rb .risks .r{font-size:12.5px;color:var(--ink-soft);line-height:1.5;display:flex;gap:8px}.rb .risks .r::before{content:"▸";color:var(--gold)}

  @media(max-width:1000px){.main{flex-direction:column}.board{width:auto;margin:6px 14px;max-height:34vh}.scene{min-height:56vh}}
  @media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style>
</head>
<body>
<div class="light"></div>
<div class="deco" style="left:2%;bottom:10%;font-size:38px">🪴</div>
<div class="deco" style="right:3%;bottom:24%;font-size:28px">🌿</div>

<div class="app">
  <div class="top">
    <div class="brand">
      <svg class="mk" viewBox="0 0 40 40"><circle cx="20" cy="20" r="19" fill="#fff" stroke="var(--gold)" stroke-width="1.6" opacity=".8"/><path d="M20 31V19" stroke="var(--green-d)" stroke-width="2.4" stroke-linecap="round"/><path d="M20 23C13 21 10 14 12 8c7 2 11 9 8 15Z" fill="var(--green)"/><circle cx="20" cy="13" r="4.4" fill="var(--green-d)"/></svg>
      <div class="t1">圓圓的技術偵察大冒險<small>AUTO · 國泰技術雷達 · 線上投保穩定性</small></div>
    </div>
    <div class="dots" id="dots"></div>
    <div class="tgap"></div>
    <div class="pts">🪙 <span id="pts">0</span></div>
    <div class="counter"><div class="n" id="cnt">0</div><div class="l">已吃方塊</div></div>
    <button class="sndbtn" id="snd" title="音效開關">🔊</button>
    <div class="scen">情境<span class="toggle"><button data-v="pass" class="on">通過</button><button data-v="fail">失敗</button></span></div>
  </div>

  <div class="main">
    <div class="board">
      <div class="bhead"><div class="win"><i></i><i></i><i></i></div><div class="bt"><span class="run"></span><span id="bTitle">系統啟動中</span></div><div class="bs" id="bSub">CLEO v3 · evaluation trace</div></div>
      <div class="board-context" id="boardContext"></div>
      <div class="log" id="log"></div>
      <div class="metrics" id="metrics"></div>
    </div>

    <div class="scene" id="stage">
      <div class="hint" id="hint"></div>
      <div id="plats"></div>
      <div id="signs"></div>
      <div id="goal"><div class="pole"></div><div class="flag"></div></div>
      <div id="pile"></div>
      <div id="yuan">
        <svg viewBox="0 0 100 104">
          <ellipse cx="50" cy="97" rx="26" ry="6" fill="rgba(50,65,90,.16)"/>
          <g class="arm armL"><ellipse cx="18" cy="60" rx="9" ry="7" fill="var(--ball)" stroke="var(--ball-sh)" stroke-width="1.5"/></g>
          <defs><radialGradient id="gb" cx="40%" cy="34%" r="72%"><stop offset="0%" stop-color="#fff"/><stop offset="70%" stop-color="var(--ball)"/><stop offset="100%" stop-color="var(--ball-sh)"/></radialGradient></defs>
          <circle cx="50" cy="54" r="34" fill="url(#gb)"/>
          <ellipse cx="38" cy="38" rx="12" ry="8" fill="#fff" opacity=".6"/>

/* ===== 音效：Web Audio 即時合成，不需外部音檔 ===== */
let AC=null,masterGain=null,muted=false;
function initAudio(){ if(AC)return; const Ctx=window.AudioContext||window.webkitAudioContext; if(!Ctx)return;
  AC=new Ctx(); masterGain=AC.createGain(); masterGain.gain.value=.25; masterGain.connect(AC.destination); }
function audioReady(){ return AC&&AC.state==='running'&&!muted; }
function unlockAudio(){ initAudio(); if(AC&&AC.state==='suspended')AC.resume().then(updateSndBtn); updateSndBtn(); }
function updateSndBtn(){ const b=$('snd'); if(!b)return; const on=AC&&AC.state==='running'&&!muted;
  b.textContent=on?'🔊':'🔇'; b.classList.toggle('off',!on); b.classList.toggle('need',!AC||AC.state!=='running'); }
function tone(f,f2,type,dur,vol,delay){
  if(!audioReady())return;
  const t0=AC.currentTime+(delay||0), o=AC.createOscillator(), g=AC.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f,t0);
  if(f2) o.frequency.exponentialRampToValueAtTime(Math.max(30,f2),t0+dur);
  g.gain.setValueAtTime(.0001,t0); g.gain.exponentialRampToValueAtTime(vol,t0+.012); g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g); g.connect(masterGain); o.start(t0); o.stop(t0+dur+.03);
}
const sfx={
  eat(){ tone(430,880,'sine',.13,.34,0); tone(150,70,'triangle',.09,.18,0); },        // 啵！
  jump(){ tone(320,820,'triangle',.26,.28,0); },                                       // 咻～
  land(){ tone(220,110,'sine',.16,.26,0); },                                           // 咚
  stage(){ tone(660,0,'sine',.14,.26,0); tone(880,0,'sine',.2,.26,.12); },             // 叮咚
  goal(){ [523,659,784,1046].forEach((f,i)=>tone(f,0,'triangle',.26,.26,i*.11)); },    // 登登登～
  fail(){ tone(400,110,'sawtooth',.5,.2,0); tone(180,70,'sine',.45,.18,.1); },         // 掉下去
  bounce(i){ const f=260-i*45; tone(f,f*.55,'sine',.16,.3,0); tone(f*2.2,f*1.2,'triangle',.09,.14,0); }, // 咚（每階更低）
};

let station=0,scenario='pass',pts=0,total=0,platRects=[],raf=null,lastT=0,blocks=[],eatIdx=0,running=false,eatTimer=null,animating=false;
const EAT_INTERVAL=760;

STATIONS.forEach(()=>$('dots').appendChild(document.createElement('i')));

function layout(){
  const st=$('stage'),W=st.clientWidth,H=st.clientHeight;
  const xs=[0.08,0.28,0.48,0.66,0.82], base=76, step=Math.min(74,(H-250)/4);
  $('plats').innerHTML='';$('signs').innerHTML='';platRects=[];
  STATIONS.forEach((s,i)=>{
    const bottom=base+i*step,left=xs[i]*W;
    const p=document.createElement('div');p.className='plat'+(i===station?' active':'');p.style.left=(left-64)+'px';p.style.bottom=bottom+'px';
    p.innerHTML=`<div class="ptop"></div><div class="pface"></div>`;$('plats').appendChild(p);
    platRects[i]={left,bottom,top:bottom+48};
    const sg=document.createElement('div');sg.className='sign'+(i===station?' active':'')+(i<station?' done':'');sg.style.left=(left-66)+'px';sg.style.bottom=(bottom+64)+'px';
    sg.innerHTML=`<div class="card"><div class="hd"><span class="num">${i+1}</span><div><div class="nm">${s.name}</div><div class="en">${s.en}</div></div></div></div><div class="post"></div>`;
    $('signs').appendChild(sg);
  });
  const gx=xs[4]*W+58;$('goal').style.left=gx+'px';$('goal').style.bottom=(platRects[4].bottom+48)+'px';
  $('cart').style.left=(W-148)+'px';$('cart').style.bottom='56px';
  placeYuan();
}
function placeYuan(){const r=platRects[station];$('yuan').style.left=(r.left-36)+'px';$('yuan').style.bottom=r.top+'px';$('pile').style.left=(r.left+26)+'px';$('pile').style.bottom=r.top+'px';}
addEventListener('resize',()=>{layout();});

function initStation(){
  const S=STATIONS[station];running=true;animating=false;eatIdx=0;
  $('hint').innerHTML=`<b>第 ${station+1} 站 / 5 · ${S.name}</b>　${S.hint}`;
  [...$('dots').children].forEach((d,i)=>{d.className=i===station?'on':(i<station?'done':'');});
  $('pile').innerHTML='';
  // board
  $('bTitle').textContent=S.bTitle;$('bSub').textContent=S.bSub;$('log').innerHTML='';$('metrics').innerHTML='';
  addLog(S.init);
  layout();
  // spawn blocks (all collectible; red/blue just colour)
  const wrap=$('blocks');wrap.innerHTML='';blocks=[];
  const W=$('stage').clientWidth,n=S.labels.length,sp=W/(n+1);
  S.labels.forEach((lb,idx)=>{
    const el=document.createElement('div');el.className='block '+(idx%2?'red':'blue');
    el.innerHTML=`<div class="cube">${lb}</div>`;wrap.appendChild(el);
    const bl={el,x:W - idx*sp*0.9 + 40,w:el.offsetWidth||50,eaten:false,idx};
    el.style.transform=`translateX(${bl.x}px)`;blocks.push(bl);
  });
  if(raf)cancelAnimationFrame(raf);lastT=0;raf=requestAnimationFrame(loop);
  clearTimeout(eatTimer);eatTimer=setTimeout(eatNext,700);
}
function loop(ts){
  if(!lastT)lastT=ts;const dt=Math.min(40,ts-lastT);lastT=ts;const W=$('stage').clientWidth;
  const spd=0.13*dt; // fast belt
  blocks.forEach(b=>{if(b.eaten)return;b.x-=spd;if(b.x<-b.w-30)b.x=W+30;b.el.style.transform=`translateX(${b.x}px)`;});
  raf=requestAnimationFrame(loop);
}
function eatNext(){
  if(!running)return;
  const S=STATIONS[station];
  if(eatIdx>=S.labels.length){ finishStation(); return; }
  const b=blocks[eatIdx];
  eat(b);
  // board line
  let line=S.eat[eatIdx];
  if(line===null) line = scenario==='fail'?S.eatFail:S.eatPass; // S4 4th
  addLog(line);
  eatIdx++;
  if(eatIdx>=S.labels.length){ setTimeout(finishStation,560); }
  else eatTimer=setTimeout(eatNext,EAT_INTERVAL);
}
function eat(b){
  b.eaten=true;const r=b.el.getBoundingClientRect();b.el.style.display='none';
  // fly UP into 圓圓 mouth
  const yr=$('yuan').getBoundingClientRect();const mouthX=yr.left+yr.width/2,mouthY=yr.top+yr.height*0.62;
  const f=document.createElement('div');f.className='fly';f.style.background=b.el.querySelector('.cube').style.background||(b.idx%2?'linear-gradient(155deg,var(--red-l),var(--red-d))':'linear-gradient(155deg,var(--blue-l),var(--blue-d))');
  f.style.background=(b.idx%2)?'linear-gradient(155deg,var(--red-l),var(--red-d))':'linear-gradient(155deg,var(--blue-l),var(--blue-d))';
  f.style.left=(r.left+r.width/2-13)+'px';f.style.top=(r.top+r.height/2-11)+'px';document.body.appendChild(f);
  const dx=mouthX-(r.left+r.width/2),dy=mouthY-(r.top+r.height/2);
  f.animate([{transform:'translate(0,0) scale(1)'},{transform:`translate(${dx*.55}px,${dy-30}px) scale(1.1)`,offset:.6},{transform:`translate(${dx}px,${dy}px) scale(.3)`,opacity:.4}],{duration:420,easing:'cubic-bezier(.4,0,.5,1)'}).onfinish=()=>{
    f.remove();
    // chomp + vibrate
    const y=$('yuan');y.classList.remove('bob');y.classList.add('chomp','vib');sfx.eat();setTimeout(()=>{y.classList.remove('chomp','vib');if(!animating)y.classList.add('bob');},330);
    ringAt(mouthX,mouthY);
    // brick under feet
    addBrick(b.idx);
    addCart(b.idx);
    total++;$('cnt').textContent=total;pts+=10;$('pts').textContent=pts;
    floaterAt(mouthX,mouthY-6,'+10');
    $('stage').classList.add('shake');setTimeout(()=>$('stage').classList.remove('shake'),200);
  };
}
function addBrick(idx){
  const S=STATIONS[station];const n=S.labels.length;
  const cur=platRects[station],nxt=platRects[station+1];
  const rise = nxt ? (nxt.top-cur.top) : 70;
  const bh=Math.max(11,(rise+8)/n), bw=42;
  const i=$('pile').children.length;
  const c=document.createElement('div');c.className='pcube';
  c.style.width=bw+'px';c.style.height=(bh-3)+'px';c.style.left='0';c.style.bottom=(i*bh)+'px';
  c.style.background=(idx%2)?'linear-gradient(155deg,var(--red-l),var(--red-d))':'linear-gradient(155deg,var(--blue-l),var(--blue-d))';
  $('pile').appendChild(c);
}
function addCart(idx){const it=document.createElement('div');it.className='it';it.style.background=(idx%2)?'linear-gradient(155deg,var(--red-l),var(--red-d))':'linear-gradient(155deg,var(--blue-l),var(--blue-d))';$('basket').appendChild(it);const c=$('cart');c.classList.add('bump');setTimeout(()=>c.classList.remove('bump'),300);}
function ringAt(x,y){const r=document.createElement('div');r.className='ring';r.style.left=(x-8)+'px';r.style.top=(y-8)+'px';document.body.appendChild(r);setTimeout(()=>r.remove(),550);}
function floaterAt(x,y,t){const f=document.createElement('div');f.className='floater';f.textContent=t;f.style.left=x+'px';f.style.top=y+'px';document.body.appendChild(f);setTimeout(()=>f.remove(),900);}
function addLog(html){const d=document.createElement('div');d.className='ln'+(html.includes('class="h"')?' h':'');d.innerHTML=html;$('log').appendChild(d);$('log').scrollTop=$('log').scrollHeight;}

function finishStation(){
  running=false;clearTimeout(eatTimer);sfx.stage();
  const S=STATIONS[station];
  let sum=S.sum; if(sum===undefined) sum = scenario==='fail'?S.sumFail:S.sumPass;
  const d=document.createElement('div');d.className='ln sum';d.innerHTML='▸ '+sum;$('log').appendChild(d);$('log').scrollTop=$('log').scrollHeight;
  let mets=S.metrics; if(!mets) mets = scenario==='fail'?S.metricsFail:S.metricsPass;
  $('metrics').innerHTML=mets.map(m=>`<div class="m"><div class="mk">${m.k}</div><div class="mv">${m.v}</div></div>`).join('');
  setTimeout(()=>{ const fail=scenario==='fail'&&station===3; if(fail) rollDown(); else autoJump(); }, 700);
}
function autoJump(){
  animating=true;const yuan=$('yuan');yuan.classList.remove('bob');
  const cur=platRects[station],nxt=platRects[station+1];
  if(!nxt){ goalReached(); return; }
  const dx=nxt.left-cur.left,dy=(nxt.top-cur.top);
  sfx.jump();
  yuan.animate([{transform:'translate(0,0)'},{transform:`translate(${dx*.5}px,${-(dy+80)}px)`,offset:.5},{transform:`translate(${dx}px,${-dy}px)`}],{duration:600,easing:'cubic-bezier(.3,.1,.3,1)'}).onfinish=()=>{
    sfx.land();
    $('pile').innerHTML='';station++;placeYuan();yuan.classList.add('bob');initStation();
  };
}
function dustAt(x,y){ for(let i=0;i<3;i++){ const d=document.createElement('div'); d.className='dust';
  d.style.left=(x-5+(i-1)*13)+'px'; d.style.top=(y-5)+'px'; d.style.animationDelay=(i*.04)+'s';
  document.body.appendChild(d); setTimeout(()=>d.remove(),620); } }
function rollDown(){
  animating=true;const yuan=$('yuan');yuan.classList.remove('bob');yuan.classList.add('sad');sfx.fail();
  let ax=0,ay=0,rot=0,cur=station;
  const land=(k)=>{
    yuan.classList.remove('squash'); void yuan.offsetWidth; yuan.classList.add('squash');
    sfx.bounce(k);
    const r=yuan.getBoundingClientRect(); dustAt(r.left+r.width/2, r.bottom-4);
    $('stage').classList.add('shake'); setTimeout(()=>$('stage').classList.remove('shake'),200);
  };
  const hop=(k)=>{
    const to=cur-1;
    if(to<0){ // 已在最底層：直接翻落地面
      const dy=platRects[0].top-30;
      yuan.animate([{transform:`translate(${ax}px,${ay}px) rotate(${rot}deg)`},
        {transform:`translate(${ax-70}px,${ay+dy}px) rotate(${rot+300}deg)`}],
        {duration:520,easing:'cubic-bezier(.4,0,.8,1)',fill:'forwards'}).onfinish=()=>{ land(k); setTimeout(()=>finale(true),620); };
      return;
    }
    const dx=platRects[to].left-platRects[cur].left, dy=platRects[cur].top-platRects[to].top;
    const nax=ax+dx, nay=ay+dy, nrot=rot+320;
    yuan.animate([
      {transform:`translate(${ax}px,${ay}px) rotate(${rot}deg)`,easing:'cubic-bezier(.2,.7,.5,1)'},
      {transform:`translate(${ax+dx*.34}px,${ay-22}px) rotate(${rot+110}deg)`,offset:.34,easing:'cubic-bezier(.5,0,.85,1)'},
      {transform:`translate(${nax}px,${nay}px) rotate(${nrot}deg)`}
    ],{duration:460,fill:'forwards'}).onfinish=()=>{
      ax=nax;ay=nay;rot=nrot;cur=to; land(k);
      setTimeout(()=>hop(k+1),190);   // 落地稍停，再彈下一階
    };
  };
  hop(0);
}
function goalReached(){const yuan=$('yuan');yuan.classList.add('cheer');sfx.goal();confetti($('yuan').getBoundingClientRect());setTimeout(()=>finale(false),700);}

function confetti(rect){const cx=rect?rect.left+rect.width/2:innerWidth/2,cy=rect?rect.top:innerHeight/2;const cols=['#5FBE7E','#F5C361','#5B8DEF','#EC7361','#3C9A5C','#DFA338'];for(let i=0;i<28;i++){const d=document.createElement('div');d.className='confetti';d.style.background=cols[i%cols.length];d.style.left=cx+'px';d.style.top=cy+'px';d.style.transform=`translateX(${(Math.random()-.5)*280}px)`;d.style.animationDelay=(Math.random()*.2)+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),1900);}}
function logoSVG(bk){const id='ct'+Math.random().toString(36).slice(2,7);const f=bk?.34:1;
  return `<svg viewBox="0 0 150 150">
  <defs><linearGradient id="${id}" gradientUnits="userSpaceOnUse" x1="24" y1="104" x2="126" y2="18">
    <stop offset="0" stop-color="${bk?'#7C7A5A':'#0C8437'}"/><stop offset=".5" stop-color="${bk?'#95926C':'#25A84B'}"/><stop offset="1" stop-color="${bk?'#ADAA80':'#63C95A'}"/></linearGradient></defs>
  <circle cx="75" cy="75" r="72" fill="#FFFDF6" stroke="var(--gold)" stroke-width="2" opacity="${bk?.45:1}"/>
  <g opacity="${f}" ${bk?'transform="rotate(-7 75 96)"':''} fill="url(#${id})">
    <ellipse cx="75" cy="64" rx="53" ry="31"/><ellipse cx="75" cy="74" rx="46" ry="21"/>
    <circle cx="44" cy="50" r="21"/><circle cx="63" cy="39" r="23"/><circle cx="91" cy="38" r="24"/>
    <circle cx="110" cy="52" r="20"/><circle cx="29" cy="64" r="16"/><circle cx="121" cy="65" r="16"/>
    <path d="M65 86 C65 98 58 104 46 110 C43.5 111.2 44.6 114 47.4 114 L102.6 114 C105.4 114 106.5 111.2 104 110 C92 104 85 98 85 86 Z"/>
  </g>
  ${bk?'<path d="M42 42L108 110M108 46L46 106" stroke="var(--red-d)" stroke-width="3.4" stroke-linecap="round" opacity=".65"/>':''}
  </svg>`;}
function starSVG(fl){const id='s'+Math.random().toString(36).slice(2,7);return `<svg viewBox="0 0 24 24"><defs><linearGradient id="${id}"><stop offset="${fl*100}%" stop-color="#F5C361"/><stop offset="${fl*100}%" stop-color="#E6DEC8"/></linearGradient></defs><path d="M12 2l3 6.5 7 .8-5.2 4.8 1.4 7L12 17.8 5.8 21l1.4-7L2 9.3l7-.8z" fill="url(#${id})" stroke="#DFA338" stroke-width="1"/></svg>`;}
function stars(n){let h='';for(let i=0;i<5;i++)h+=starSVG(Math.max(0,Math.min(1,n-i)));return h;}
function finale(fail){const R=REPORT[fail?'fail':'pass'];const f=$('final');f.className='final'+(fail?' fail':'');
  f.innerHTML=`<div class="la">${logoSVG(fail)}</div><div class="yay">${fail?'哎呀，滾下去了 😢':'GOAL！太好了 🎉'}</div>
  <div class="msg">${fail?`驗證漏檢、本輪<b>不推薦</b><br>導入「${R.scene}」`:`圓圓爬到終點！<br>新技術適合「<b>${R.scene}</b>」！`}</div>
  <div class="stars">${stars(R.stars)}</div><div class="rate">推薦指數 ${R.stars} / 5　·　象限 ${R.quad}</div>
  <div class="fb"><button class="fbtn fbtn-p" id="viewRep">查看完整報告</button><button class="fbtn fbtn-g" id="replay">再看一次 ↺</button></div>`;
  $('overlay').classList.add('show');if(!fail)confetti(null);
  $('viewRep').onclick=()=>openReport(fail);$('replay').onclick=()=>location.reload();
}
function openReport(fail){const R=REPORT[fail?'fail':'pass'];
  $('repBox').innerHTML=`<h3>技術評估報告<button class="x" id="repX">✕</button></h3>
  <div class="meta">${R.scene} · 雲端技術雷達 PoC　·　S1→S2→S3→S4→S5　·　外部黑箱，不碰 PII / 不出單 / 不用 Bedrock</div>
  <div class="rgrid"><div class="rcell"><div class="k">雷達象限</div><div class="v q">${R.quad}</div></div><div class="rcell"><div class="k">AHP 綜合分</div><div class="v s">${R.score}</div></div><div class="rcell"><div class="k">驗證閘門</div><div class="v g ${fail?'fail':'pass'}">${R.gate}</div></div></div>
  <div class="rb"><div class="bk">推薦組合</div><div class="reco">${R.reco.map(x=>`<div class="r"><b>${x.a}</b><span>${x.b}</span></div>`).join('')}</div></div>
  <div class="rb"><div class="bk">建議路徑</div><p>${R.next}</p></div>
  <div class="rb"><div class="bk">風險與限制</div><div class="risks">${R.risks.map(r=>`<div class="r">${r}</div>`).join('')}</div></div>
  <div style="margin-top:12px"><button class="fbtn fbtn-p" onclick="window.print()">列印 / 匯出</button></div>`;
  $('repOverlay').classList.add('show');$('repX').onclick=()=>$('repOverlay').classList.remove('show');
}
$('repOverlay').addEventListener('click',e=>{if(e.target===$('repOverlay'))$('repOverlay').classList.remove('show');});
document.querySelectorAll('.toggle button').forEach(b=>b.addEventListener('click',()=>{scenario=b.dataset.v;document.querySelectorAll('.toggle button').forEach(x=>x.classList.toggle('on',x.dataset.v===scenario));}));
$('snd').addEventListener('click',()=>{ initAudio(); if(AC&&AC.state==='suspended')AC.resume(); muted=!muted; updateSndBtn(); if(!muted) sfx.eat(); });
updateSndBtn();

$('yuan').classList.add('bob');
window.RADAR_VISUAL_READY = true;
</script>

<script src="app.js"></script>
