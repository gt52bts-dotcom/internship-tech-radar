<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cleo 的 Skill 進度儀錶板</title>
  <style>
    :root{--bg:#f5f6f8;--card:#fff;--ink:#172b4d;--muted:#6b778c;--line:#dfe1e6}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Noto Sans TC","Microsoft JhengHei","Segoe UI",sans-serif}
    .wrap{max-width:1180px;margin:auto;padding:22px}
    .head{display:flex;justify-content:space-between;gap:16px;align-items:end;margin-bottom:16px}
    h1{font-size:24px;margin:0}.sub{color:var(--muted);font-size:13px;margin-top:5px}
    select{border:1px solid var(--line);border-radius:8px;background:#fff;padding:9px 12px;color:var(--ink)}
    .grid{display:grid;grid-template-columns:minmax(300px,.9fr) minmax(480px,1.6fr);gap:16px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:0 2px 7px #091e4220}
    .title{font-weight:700;margin-bottom:12px}
    .donut-row{display:flex;gap:22px;align-items:center}
    .donut{width:210px;height:210px;border-radius:50%;position:relative;flex:none}
    .donut:after{content:"";position:absolute;inset:30px;border-radius:50%;background:#fff}
    .center{position:absolute;inset:0;display:grid;place-content:center;text-align:center;z-index:1}
    .score{font-size:38px;font-weight:800}.unit{font-size:12px;color:var(--muted)}
    .legend{display:grid;gap:9px;font-size:13px}.legend-row{display:grid;grid-template-columns:11px 1fr auto;gap:8px;align-items:center}
    .dot{width:10px;height:10px;border-radius:50%}.val{font-variant-numeric:tabular-nums;font-weight:700}
    .scroll{overflow-x:auto;padding:8px 4px 10px;border-bottom:1px solid var(--line);cursor:grab;user-select:none}
    .scroll.dragging{cursor:grabbing}
    .bars{display:flex;gap:22px;align-items:end;min-width:max-content;height:270px;padding:10px 10px 0}
    .day{width:54px;height:235px;display:flex;flex-direction:column;justify-content:end;align-items:center}
    .stack{width:38px;display:flex;flex-direction:column-reverse;border-radius:6px 6px 2px 2px;overflow:hidden;background:#ebecf0;box-shadow:inset 0 0 0 1px #dfe1e6}
    .seg{width:100%;min-height:0}.date{font-size:11px;color:var(--muted);margin-top:8px;white-space:nowrap}.total{font-size:11px;font-weight:700;margin-bottom:5px}
    .hint{font-size:12px;color:var(--muted);margin-top:9px}.bottom{margin-top:16px}.cum-list{display:grid;gap:14px}
    .cum-row{display:grid;grid-template-columns:190px 1fr 56px;gap:12px;align-items:center}
    .track{height:22px;background:#ebecf0;border-radius:12px;overflow:hidden}.fill{height:100%;border-radius:12px}
    .skill-name{font-size:13px}.cum-val{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
    @media(max-width:820px){.grid{grid-template-columns:1fr}.head{align-items:start;flex-direction:column}.donut-row{flex-direction:column}.cum-row{grid-template-columns:130px 1fr 48px}.wrap{padding:12px}}
  </style>
</head>
<body>
<main class="wrap">
  <header class="head">
    <div>
      <h1>五大 Skill 進度儀錶板</h1>
      <div class="sub">掃描、比較、評估、驗證、報告：只記錄有證據的每日成果。</div>
    </div>
    <label>查看日期
      <select id="dateSelect"></select>
    </label>
  </header>
  <section class="grid">
    <article class="card">
      <div class="title">單日分數分布</div>
      <div class="donut-row">
        <div id="donut" class="donut"><div class="center"><div id="dayTotal" class="score">0</div><div class="unit">今日總分</div></div></div>
        <div id="legend" class="legend"></div>
      </div>
    </article>
    <article class="card">
      <div class="title">每日分數趨勢</div>
      <div class="scroll" id="scroll"><div id="dayBars" class="bars"></div></div>
      <div class="hint">分數代表可驗證進展；每日五個 Skill 加總最高 10 分。</div>
    </article>
  </section>
  <section class="card bottom">
    <div class="title">累積 Skill 分數</div>
    <div id="cumulative" class="cum-list"></div>
  </section>
</main>
<script>
const skills=[
  {id:'scan',name:'掃描 Scan',label:'Skill 1｜掃描',color:'#2684FF'},
  {id:'compare',name:'比較 Compare',label:'Skill 2｜比較',color:'#36B37E'},
  {id:'evaluate',name:'評估 Evaluate',label:'Skill 3｜評估',color:'#FF991F'},
  {id:'validate',name:'驗證 Validate',label:'Skill 4｜驗證',color:'#6554C0'},
  {id:'report',name:'報告 Report',label:'Skill 5｜報告',color:'#DE350B'}
];
const scoreData=[
  {date:'2026-07-13',scores:{scan:1,compare:2,evaluate:1,validate:3,report:1}},
  {date:'2026-07-14',scores:{scan:1,compare:1,evaluate:1,validate:2,report:1}},
  {date:'2026-07-15',scores:{scan:1,compare:1,evaluate:1,validate:1,report:1}},
  {date:'2026-07-16',scores:{scan:1,compare:1,evaluate:2,validate:3,report:1}},
  {date:'2026-07-17',scores:{scan:1,compare:1,evaluate:2,validate:4,report:2}},
  {date:'2026-07-20',scores:{scan:2,compare:1,evaluate:2,validate:1,report:1}},
  {date:'2026-07-21',scores:{scan:1,compare:1,evaluate:2,validate:4,report:1}},
  {date:'2026-07-22',scores:{scan:1,compare:1,evaluate:2,validate:2,report:2}},
  {date:'2026-07-23',scores:{scan:1,compare:1,evaluate:1,validate:1,report:1}},
  {date:'2026-07-24',scores:{scan:0,compare:0,evaluate:1,validate:0,report:3}},
  {date:'2026-07-27',scores:{scan:2,compare:1,evaluate:1,validate:3,report:2}},
  {date:'2026-07-28',scores:{scan:3,compare:2,evaluate:1,validate:1,report:1}},
  {date:'2026-07-29',scores:{scan:2,compare:2,evaluate:1,validate:4,report:1}},
  {date:'2026-07-30',scores:{scan:1,compare:1,evaluate:2,validate:4,report:2}},
  {date:'2026-07-31',scores:{scan:1,compare:1,evaluate:2,validate:4,report:2}},
  {date:'2026-08-03',scores:{scan:2,compare:1,evaluate:2,validate:3,report:2}},
  {date:'2026-08-04',scores:{scan:2,compare:2,evaluate:2,validate:0,report:2}},
  {date:'2026-08-05',scores:{scan:0,compare:0,evaluate:4,validate:2,report:2}},
  {date:'2026-08-10',scores:{scan:1,compare:1,evaluate:2,validate:1,report:1}},
  {date:'2026-08-11',scores:{scan:1,compare:1,evaluate:1,validate:0,report:2}},
  {date:'2026-08-12',scores:{scan:0,compare:0,evaluate:1,validate:1,report:2}},
  {date:'2026-08-13',scores:{scan:1,compare:1,evaluate:3,validate:2,report:3}}
];
const fmt=n=>Number(n.toFixed(2)).toString();
const total=d=>skills.reduce((s,k)=>s+(d.scores[k.id]||0),0);
const select=document.querySelector('#dateSelect');
const scroll=document.querySelector('#scroll');
let dragging=false,dragStartX=0,dragStartLeft=0;
scoreData.forEach(d=>{const o=document.createElement('option');o.value=d.date;o.textContent=d.date;select.appendChild(o)});
select.value=scoreData.at(-1).date;
function renderDay(date){
  const d=scoreData.find(x=>x.date===date)||scoreData.at(-1),sum=total(d);
  document.querySelector('#dayTotal').textContent=fmt(sum);
  let start=0,parts=[];
  skills.forEach(k=>{
    const v=d.scores[k.id]||0,end=start+(sum?v/sum*100:0);
    if(v>0)parts.push(`${k.color} ${start}% ${end}%`);
    start=end;
  });
  document.querySelector('#donut').style.background=parts.length?`conic-gradient(${parts.join(',')})`:'#dfe1e6';
  document.querySelector('#legend').innerHTML=skills.map(k=>`<div class="legend-row"><i class="dot" style="background:${k.color}"></i><span>${k.label}</span><span class="val">${fmt(d.scores[k.id]||0)}</span></div>`).join('');
}
function renderBars(){
  const max=Math.max(...scoreData.map(total),1);
  document.querySelector('#dayBars').innerHTML=scoreData.map(d=>{
    const sum=total(d),h=Math.max(sum/max*190,2);
    const segs=skills.map(k=>{
      const v=d.scores[k.id]||0;
      return `<div class="seg" title="${k.label} ${fmt(v)}" style="height:${sum?v/sum*h:0}px;background:${k.color}"></div>`;
    }).join('');
    return `<div class="day"><div class="total">${fmt(sum)}</div><div class="stack" style="height:${h}px">${segs}</div><div class="date">${d.date.slice(5).replace('-','/')}</div></div>`;
  }).join('');
  requestAnimationFrame(()=>{const s=document.querySelector('#scroll');s.scrollLeft=s.scrollWidth});
}
function renderCum(){
  const sums=Object.fromEntries(skills.map(k=>[k.id,scoreData.reduce((n,d)=>n+(d.scores[k.id]||0),0)]));
  const max=Math.max(...Object.values(sums),1);
  document.querySelector('#cumulative').innerHTML=skills.map(k=>`<div class="cum-row"><div class="skill-name">${k.label}</div><div class="track"><div class="fill" style="width:${sums[k.id]/max*100}%;background:${k.color}"></div></div><div class="cum-val">${fmt(sums[k.id])}</div></div>`).join('');
}
select.addEventListener('change',e=>renderDay(e.target.value));
scroll.addEventListener('pointerdown',e=>{
  dragging=true;dragStartX=e.clientX;dragStartLeft=scroll.scrollLeft;
  scroll.classList.add('dragging');scroll.setPointerCapture(e.pointerId);
});
scroll.addEventListener('pointermove',e=>{if(dragging)scroll.scrollLeft=dragStartLeft-(e.clientX-dragStartX)});
scroll.addEventListener('pointerup',()=>{dragging=false;scroll.classList.remove('dragging')});
scroll.addEventListener('pointercancel',()=>{dragging=false;scroll.classList.remove('dragging')});
renderDay(select.value);
renderBars();
renderCum();
</script>
</body>
</html>
