project: cathay-techintel-v3
budget:
  currency: USD
  max_total: 100
  period: company-account-landing-validation
  status: within_budget

cost_policy:
  use_bedrock: false
  use_anthropic_api: optional
  default_ai_mode: rubric_fallback
  avoid_high_fixed_cost_services:
    - Amazon Bedrock
    - Bedrock Knowledge Bases
    - CloudFront
    - OpenSearch
    - RDS
    - EC2

estimated_monthly_cost:
  s3:
    purpose: store pipeline json and html reports
    estimate_usd: 1
  lambda:
    purpose: run S1-S5 pipeline
    estimate_usd: 1
  step_functions:
    purpose: orchestrate five-step workflow
    estimate_usd: 1
  dynamodb:
    purpose: store picks and experiment logs
    estimate_usd: 1
  secrets_manager:
    purpose: store Anthropic API key
    estimate_usd: 0.4
  cloudwatch_logs:
    purpose: execution logs
    estimate_usd_range: [1, 3]
  cognito:
    purpose: API authentication
    estimate_usd: 0
  api_gateway:
    purpose: manual pipeline trigger
    estimate_usd: 1
  anthropic_api:
    purpose: optional evaluator and validator model calls
    estimate_usd: "0.09_per_approved_run"
    controlled_by_quote_gate: true

estimated_total_monthly_usd_range: [5, 15]
implementation_decision: proceed
notes:
  - "Bedrock is intentionally excluded for this phase."
  - "CloudFront is intentionally excluded in the company-account package to avoid global-service restrictions."
  - "Anthropic API is controlled by the quote gate; over-budget runs fall back to zero-token rubric mode."
  - "Run cdk destroy --all after landing validation if the environment is no longer needed."
